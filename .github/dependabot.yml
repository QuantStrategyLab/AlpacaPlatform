version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  commit-message:
    prefix: "chore"
  groups:
    actions:
      patterns:
        - "*"
  open-pull-requests-limit: 3
- package-ecosystem: pip
  directory: /
  schedule:
    interval: weekly
  commit-message:
    prefix: "chore"
  open-pull-requests-limit: 5
